backend:
  name: github
  # ⚠️ Troque pelo seu usuário e repositório GitHub (ex: rpinetti/dagaz-dev-website)
  repo: rpinetti/dagaz-dev-website
  branch: main
  auth_type: pkce
  app_id: Ov23lierLWbqjf9aXTsd

# Pasta onde as imagens dos posts serão salvas no repositório
media_folder: "public/image/blog"
# Caminho público das imagens após o build
public_folder: "/image/blog"

locale: "pt"

# ── Configuração global de i18n ───────────────────────────────────────────────
# "multiple_folders" cria:
#   public/content/blog/pt/slug.md
#   public/content/blog/en/slug.md
#   public/content/blog/es/slug.md
# — exatamente a estrutura que já temos no projeto.
i18n:
  structure: multiple_folders
  locales: [ pt, en, es ]
  default_locale: pt

collections:
  # ── Blog (todas as línguas em uma coleção) ───────────────────────────────────
  - name: "blog"
    label: "📝 Blog"
    label_singular: "Post"
    folder: "public/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date}}"
    # Ativa i18n para esta coleção
    # O editor exibirá abas: PT | EN | ES
    i18n: true
    fields:
      # i18n: true  → cada idioma tem o seu próprio valor
      # i18n: duplicate → o valor é copiado igual para todos os idiomas (pode editar depois)

      - label: "Título"
        name: "title"
        widget: "string"
        i18n: true

      - label: "Data de Publicação"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        i18n: duplicate # mesma data em todos os idiomas

      - label: "Autor"
        name: "author"
        widget: "string"
        default: "Caio Dagaz"
        i18n: duplicate

      - label: "Categoria (exibição)"
        name: "category"
        widget: "select"
        i18n: true # pode ter nome diferente por idioma
        options:
          - { label: "Domínios SAP", value: "Domínios SAP" }
          - { label: "ABAP", value: "ABAP" }
          - { label: "Carreira", value: "Carreira" }
          - { label: "Liderança", value: "Liderança" }
          - { label: "BTP", value: "BTP" }

      - label: "Categoria (chave de filtro)"
        name: "categoryKey"
        widget: "select"
        i18n: duplicate # a chave de filtro é igual em todos os idiomas
        options:
          - { label: "SAP", value: "sap" }
          - { label: "ABAP", value: "abap" }
          - { label: "Carreira", value: "career" }
          - { label: "Liderança", value: "leadership" }
          - { label: "BTP", value: "btp" }

      - label: "Tempo de Leitura (minutos)"
        name: "readingTime"
        widget: "number"
        default: 5
        value_type: "int"
        min: 1
        max: 60
        i18n: duplicate

      - label: "Resumo (card do blog)"
        name: "summary"
        widget: "text"
        hint: "Exibido nos cards da listagem. Traduza para cada idioma."
        i18n: true

      - label: "Descrição SEO"
        name: "desc"
        widget: "text"
        hint: "Usada nas meta tags. Ideal: 120–160 caracteres. Traduza para cada
          idioma."
        i18n: true

      - label: "Imagem de Capa (URL)"
        name: "image"
        widget: "string"
        required: false
        hint: "URL completa da imagem (ex: CloudFront ou /image/blog/nome.webp)"
        i18n: duplicate # mesma imagem para todos os idiomas

      - label: "Conteúdo"
        name: "body"
        widget: "markdown"
        i18n: true # conteúdo traduzido em cada idioma
